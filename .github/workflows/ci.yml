name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          python -m unittest tests_retention
          shellcheck scripts/*
      - name: Back up to MinIO and check a real PostgreSQL restore
        run: |
          scripts/init-env
          scripts/demo
          grep -E '^portfolio_pg_backup_last_success_timestamp_seconds [0-9]+$' metrics/pg_backup.prom
