services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${PGPASSWORD:?Run scripts/init-env}
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "portfolio", "-d", "portfolio"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data
    ports: ["127.0.0.1::9000"]
    environment:
      MINIO_ROOT_USER: portfolio
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Run scripts/init-env}
